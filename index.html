<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星星游乐岛">
<meta name="theme-color" content="#9fdcf5">
<title>星星游乐岛</title>
<link rel="icon" href="assets/icon/favicon.png">
<link rel="apple-touch-icon" href="assets/icon/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #9fdcf5;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
/* 启动代码：先拿最新构建号，再用 game.js?b=构建号 加载游戏（发新版后一定拿新的）。尽量别再改这里 */
(function () {
  function pickBuild(fetched, stored) {
  if (fetched) return String(fetched);
  if (stored) return String(stored);
  return '';
}
  var KEY = 'starland_build', stored = null, started = false;
  try { stored = localStorage.getItem(KEY); } catch (e) {}
  function start(fetched) {
    if (started) return;
    started = true;
    var b = pickBuild(fetched, stored);
    if (fetched) { try { localStorage.setItem(KEY, fetched); } catch (e) {} }
    window.__BUILD = b;
    var s = document.createElement('script');
    s.src = b ? 'game.js?b=' + encodeURIComponent(b) : 'game.js';
    document.body.appendChild(s);
  }
  setTimeout(function () { start(null); }, 3000);
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { start(j && j.build ? String(j.build) : null); })
      .catch(function () { start(null); });
  } catch (e) { start(null); }
})();
</script>
</body>
</html>
